version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: ./infra/api/Dockerfile.api
    container_name: api
    ports:
      - "8081:8081"
    restart: always
    depends_on:
      - mysql

  front:
    build:
      context: .
      dockerfile: ./infra/front/Dockerfile.front
    container_name: front
    ports:
      - "80:80"

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    env_file:
      - env/mysql.env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
